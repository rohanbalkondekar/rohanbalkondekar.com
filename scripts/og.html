<meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; font-weight: 300 800; src: url("../fonts/geist.woff2") format("woff2"); }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; display: grid; place-items: center; background: #FBFCFD; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
.bg { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(#94A3B8 2.2px, transparent 2.6px); background-size: 26px 26px; -webkit-mask: radial-gradient(ellipse 46% 52% at 50% 50%, transparent 62%, #000 100%); }
.w { position: relative; display: flex; align-items: flex-end; gap: 40px; }
svg { margin-bottom: 14px; }
h1 { font-size: 80px; font-weight: 650; letter-spacing: -.035em; color: #0B1220; }
</style>
<div class="bg"></div>
<div class="w"><svg id="m"></svg><h1>Rohan Balkondekar</h1></div>
<script>
// peacock fan mark: rings of dots, outer ring carries the "eyes"
function fan(o={}){const {rings=4,step=24,spread=78,c1='#5EEAD4',c2='#3B82F6',eye='#0F172A',base=3.2,grow=1.9,eyes=true}=o;
let h='';const R=rings*step+base+grow*rings+4;
for(let k=1;k<=rings;k++){const n=3+2*k,r=k*step,d=base+grow*k;
for(let i=0;i<n;i++){const a=(-spread+2*spread*i/(n-1))*Math.PI/180,x=Math.sin(a)*r,y=-Math.cos(a)*r;
const col=k==rings?c1:mix(c2,c1,(k-1)/(rings-1));
h+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${d}" fill="${col}"/>`;
if(eyes&&k==rings)h+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(d*.42).toFixed(2)}" fill="${eye}"/>`}}
h+=`<circle cx="0" cy="0" r="${base+1}" fill="${c2}"/>`;
return {svg:h,R}}
function mix(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function put(el,o,size){const f=fan(o);el.setAttribute('viewBox',`${-f.R} ${-f.R-2} ${2*f.R} ${f.R+10}`);el.style.width=size+'px';el.style.height=size*(f.R+10)/(2*f.R)+'px';el.innerHTML=f.svg}
put(m, { c1: '#0D9488', c2: '#1D4ED8', eye: '#FBFCFD' }, 210)
</script>
